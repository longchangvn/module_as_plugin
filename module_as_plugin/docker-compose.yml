services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: module_platform
      POSTGRES_PASSWORD: module_platform
      POSTGRES_DB: module_platform
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-module_migrator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Gateway.Api/Dockerfile
    ports:
      - "5100:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SecretKey: ${JWT_SECRET:?set JWT_SECRET (>=32 chars, see .env.example)}
      # Guards /api/v1/gateway/internal/** and the reconcile pull from the platform.
      InternalApi__Key: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY (>=32 chars, see .env.example)}
      Platform__BaseUrl: http://platform:8080
    # Persist file stores across restarts by bind-mounting the individual files
    # (copy them out of the image once, then uncomment):
    # volumes:
    #   - ./gateway-data/ocelot.json:/app/ocelot.json
    #   - ./gateway-data/gateway-services.json:/app/gateway-services.json
    #   - ./gateway-data/gateway-modules.json:/app/gateway-modules.json
    depends_on:
      - platform
      - auth

  platform:
    build:
      context: .
      dockerfile: src/Platform/Platform.Api/Dockerfile
    ports:
      - "5121:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Catalog: Host=postgres;Username=module_platform;Password=module_platform;Database=module_platform
      Gateway__BaseUrl: http://gateway:8080
      Auth__BaseUrl: http://auth:8080
      TenantStores__Host: postgres
      TenantStores__Port: 5432
      TenantStores__Username: module_platform
      TenantStores__Password: module_platform
      TenantStores__SharedDatabase: module_platform
      TenantStores__ProvisioningConnection: Host=postgres;Username=module_platform;Password=module_platform;Database=postgres
      Jwt__SecretKey: ${JWT_SECRET:?set JWT_SECRET (>=32 chars, see .env.example)}
      InternalApi__Key: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY (>=32 chars, see .env.example)}
      # DataProtection keys must survive restarts, otherwise issued JWTs are
      # rejected after a container recreate (and OAuth state protection breaks).
      DataProtection__KeyDirectory: /var/lib/dpkeys
      # Module packages (zip uploads) — the source the Module Host downloads plugins from.
      ModulePackages__Root: /var/lib/module-packages
      # Module Host: cluster URL (platform + gateway) and browser URL for plugin UI assets.
      PluginHost__BaseUrl: http://plugin-host:8080
      PluginHost__PublicBaseUrl: ${PLUGIN_HOST_PUBLIC_URL:-http://localhost:5300}
    volumes:
      - dpkeys:/var/lib/dpkeys
      - pluginpackages:/var/lib/module-packages
    depends_on:
      - postgres

  # Module Host (:5300) — loads plugin modules in-process, one runtime per (module, version),
  # gated per tenant; reconciles from the platform on start-up.
  plugin-host:
    build:
      context: .
      dockerfile: src/PluginHost/PluginHost.Api/Dockerfile
    ports:
      - "5300:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SecretKey: ${JWT_SECRET:?set JWT_SECRET (>=32 chars, see .env.example)}
      InternalApi__Key: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY (>=32 chars, see .env.example)}
      Platform__BaseUrl: http://platform:8080
      Auth__BaseUrl: http://auth:8080
      PluginHost__CacheRoot: /var/lib/plugin-cache
    volumes:
      - plugincache:/var/lib/plugin-cache
    depends_on:
      - platform
      - auth

  auth:
    build:
      context: .
      dockerfile: src/Auth/Auth.Api/Dockerfile
    ports:
      - "5122:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Tenant: Host=postgres;Username=module_platform;Password=module_platform;Database=module_platform
      Platform__BaseUrl: http://platform:8080
      TenantStores__Host: postgres
      TenantStores__Port: 5432
      TenantStores__Username: module_platform
      TenantStores__Password: module_platform
      TenantStores__SharedDatabase: module_platform
      Jwt__SecretKey: ${JWT_SECRET:?set JWT_SECRET (>=32 chars, see .env.example)}
      InternalApi__Key: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY (>=32 chars, see .env.example)}
    depends_on:
      - postgres

  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - gateway

  # Sample module API (:5201) — the platform registers it as a module service;
  # gateway routes resolve its downstream from the published artifact API URL.
  loyalty:
    build:
      context: .
      dockerfile: src/Modules/Loyalty/Loyalty.Api/Dockerfile
    ports:
      - "5201:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SecretKey: ${JWT_SECRET:?set JWT_SECRET (>=32 chars, see .env.example)}
    depends_on:
      - postgres
      - gateway

  # Module Federation remote (:5174) — remoteEntry.js for the shell to load.
  loyalty-web:
    build:
      context: .
      dockerfile: modules/loyalty/web/Dockerfile
    ports:
      - "5174:80"

  # Sample test modules — APIs (:5202/:5203) + federation remotes (:5176/:5177).
  sample1:
    build:
      context: .
      dockerfile: src/Modules/Sample1/Sample1.Api/Dockerfile
    ports:
      - "5202:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SecretKey: ${JWT_SECRET:?set JWT_SECRET (>=32 chars, see .env.example)}
      Platform__BaseUrl: http://platform:8080
      Auth__BaseUrl: http://auth:8080
    depends_on:
      - platform
      - auth

  sample2:
    build:
      context: .
      dockerfile: src/Modules/Sample2/Sample2.Api/Dockerfile
    ports:
      - "5203:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SecretKey: ${JWT_SECRET:?set JWT_SECRET (>=32 chars, see .env.example)}
      Platform__BaseUrl: http://platform:8080
      Auth__BaseUrl: http://auth:8080
    depends_on:
      - platform
      - auth

  sample1-web:
    build:
      context: .
      dockerfile: modules/sample1/web/Dockerfile
    ports:
      - "5176:80"

  sample2-web:
    build:
      context: .
      dockerfile: modules/sample2/web/Dockerfile
    ports:
      - "5177:80"

  # Tenant backoffice SPA (:5175) — proxies /api/v1 to the gateway.
  tenant-admin:
    build:
      context: .
      dockerfile: apps/tenant-admin/Dockerfile
    ports:
      - "5175:80"
    depends_on:
      - gateway

  # >>> module:inventory (create-module)
  inventory:
    build:
      context: .
      dockerfile: src/Modules/Inventory/Inventory.Api/Dockerfile
    ports:
      - "5204:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SecretKey: ${JWT_SECRET:?set JWT_SECRET (>=32 chars, see .env.example)}
      Platform__BaseUrl: http://platform:8080
      Auth__BaseUrl: http://auth:8080
    depends_on:
      - platform
      - auth

  inventory-web:
    build:
      context: .
      dockerfile: modules/inventory/web/Dockerfile
    ports:
      - "5179:80"
  # <<< module:inventory

volumes:
  pgdata:
  dpkeys:
  pluginpackages:
  plugincache:
